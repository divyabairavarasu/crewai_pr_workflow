[project]
name = "crewai-pr-workflow"
version = "2.0.0"
description = "AI-powered PR review workflow using CrewAI multi-agent system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Divya Bairavarasu"}
]
keywords = ["crewai", "code-review", "ai", "github", "pr-review", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "crewai>=0.100.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "diskcache>=5.6.0",
    "radon>=6.0.1",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.25.0"]
groq = ["groq>=0.5.0"]
all-providers = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "groq>=0.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
pr-review = "pr_workflow.cli:app"

[project.urls]
Homepage = "https://github.com/divyabairavarasu/crewai_pr_workflow"
Repository = "https://github.com/divyabairavarasu/crewai_pr_workflow"
Issues = "https://github.com/divyabairavarasu/crewai_pr_workflow/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
