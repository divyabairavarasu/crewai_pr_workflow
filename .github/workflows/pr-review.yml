name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'PR URL to review (e.g., https://github.com/owner/repo/pull/123)'
        required: true
        type: string
      review_mode:
        description: 'Review mode'
        required: false
        default: 'comment'
        type: choice
        options:
          - comment
          - dry-run
          - create-pr

# Prevent concurrent reviews on the same PR
concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.inputs.pr_url }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    # Skip if PR is from a fork (security) or is a draft
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.draft == false && 
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all-providers]"

      - name: Determine PR URL
        id: pr-url
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "url=${{ github.event.inputs.pr_url }}" >> $GITHUB_OUTPUT
            echo "mode=${{ github.event.inputs.review_mode }}" >> $GITHUB_OUTPUT
          else
            echo "url=https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "mode=comment" >> $GITHUB_OUTPUT
          fi

      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configure your preferred LLM provider
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL || 'deepseek-reasoner' }}
          REVIEWER_API_KEY: ${{ secrets.REVIEWER_API_KEY }}
          REVIEWER_BASE_URL: ${{ vars.REVIEWER_BASE_URL || 'https://api.deepseek.com' }}
          IMPLEMENTER_MODEL: ${{ vars.IMPLEMENTER_MODEL || 'gpt-4o-mini' }}
          IMPLEMENTER_API_KEY: ${{ secrets.IMPLEMENTER_API_KEY || secrets.OPENAI_API_KEY }}
          # Performance settings
          MAX_LOC_PER_BATCH: ${{ vars.MAX_LOC_PER_BATCH || '2000' }}
          MAX_REVIEW_AGENTS: ${{ vars.MAX_REVIEW_AGENTS || '3' }}
          SKIP_DOC_REVIEWS: 'true'
          REVIEW_ONLY: 'true'
          POST_SUMMARY_COMMENT: 'true'
          INCREMENTAL_COMMENTS: 'false'
        run: |
          MODE_FLAG=""
          if [ "${{ steps.pr-url.outputs.mode }}" == "comment" ]; then
            MODE_FLAG="--comment"
          elif [ "${{ steps.pr-url.outputs.mode }}" == "dry-run" ]; then
            MODE_FLAG="--dry-run"
          elif [ "${{ steps.pr-url.outputs.mode }}" == "create-pr" ]; then
            MODE_FLAG="--create-pr"
          fi
          
          pr-review "${{ steps.pr-url.outputs.url }}" $MODE_FLAG

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-results-${{ github.run_id }}
          path: out/
          retention-days: 30

  # Optional: Run on schedule for open PRs
  scheduled-review:
    name: Scheduled PR Review
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all-providers]"

      - name: Review open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER_API_KEY: ${{ secrets.REVIEWER_API_KEY }}
        run: |
          # Get list of open PRs
          prs=$(gh pr list --json number,url --jq '.[].url')
          
          for pr_url in $prs; do
            echo "Reviewing: $pr_url"
            pr-review "$pr_url" --comment || true
            sleep 60  # Rate limiting
          done
